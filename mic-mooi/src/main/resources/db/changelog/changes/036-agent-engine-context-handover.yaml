databaseChangeLog:
  - changeSet:
      id: 036-agent-engine-context-handover
      author: mooi
      changes:
        - addColumn:
            tableName: agent_engine_defaults
            columns:
              - column:
                  name: session_context_handover
                  type: smallint
                  remarks: Context percent at which new sessions of this provider hand over their work; NULL is off
        - sql:
            sql: |
              ALTER TABLE agent_engine_defaults ADD CONSTRAINT ck_agent_engine_defaults_context_handover
                CHECK (session_context_handover IS NULL OR session_context_handover BETWEEN 10 AND 95);
      rollback:
        - dropColumn:
            tableName: agent_engine_defaults
            columnName: session_context_handover
