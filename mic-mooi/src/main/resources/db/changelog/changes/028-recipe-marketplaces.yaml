databaseChangeLog:
  - changeSet:
      id: 028-recipe-marketplaces
      author: mooi
      changes:
        - createTable:
            tableName: recipe_marketplaces
            remarks: A GitHub repository of recipes linked by a player, by reference only
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_recipe_marketplaces
                    nullable: false
              - column:
                  name: player_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: github_repo_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: owner
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(1024)
              - column:
                  name: is_private
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: default_branch
                  type: varchar(128)
              - column:
                  name: html_url
                  type: varchar(512)
              - column:
                  name: added_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_recipe_marketplaces_player
            baseTableName: recipe_marketplaces
            baseColumnNames: player_id
            referencedTableName: players
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            constraintName: uq_recipe_marketplaces_player_repo
            tableName: recipe_marketplaces
            columnNames: player_id, github_repo_id
        - createIndex:
            indexName: ix_recipe_marketplaces_player_added
            tableName: recipe_marketplaces
            columns:
              - column:
                  name: player_id
              - column:
                  name: added_at
                  descending: true
      rollback:
        - dropTable:
            tableName: recipe_marketplaces
