[project]
name = "mic-sessions"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk==0.2.159",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "pyjwt",
    "openai-codex==0.156.1",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mic_sessions"]

[tool.ruff]
line-length = 110
