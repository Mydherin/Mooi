name: mooi

services:
  postgres:
    image: postgres:18-alpine
    container_name: mooi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mooi}
      POSTGRES_USER: ${POSTGRES_USER:-mooi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-mooi} -d ${POSTGRES_DB:-mooi}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - data

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: mooi-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mooi.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-change-me}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

volumes:
  postgres-data:
    name: mooi-postgres-data
  pgadmin-data:
    name: mooi-pgadmin-data

networks:
  data:
    name: mooi-data
