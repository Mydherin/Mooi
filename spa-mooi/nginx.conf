# Single gateway of Mooi's origin. TLS ends at the edge proxy (Traefik); every backend is reached by
# path, so the SPA, the API, the sessions service and dictation share one origin and need no CORS.
#
#   /api/mooi/*      -> mic-mooi       (prefix stripped)
#   /api/sessions/*  -> mic-sessions   (prefix stripped, SSE never buffered)
#   /api/stt/*       -> mic-speech     (path kept, WebSocket; loopback of this network namespace)
#   everything else  -> the static bundle with React Router fallback
#
# Preview origins (<id>.preview.<domain>) never reach this server: the edge routes them straight to
# mic-sessions.

client_max_body_size 100m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript image/svg+xml;

    # Docker DNS resolved per request: the SPA keeps serving while a backend restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;

    location /api/mooi/ {
        set $mooi_upstream http://mic-mooi:8080;
        rewrite ^/api/mooi/(.*)$ /$1 break;
        proxy_pass $mooi_upstream;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /api/sessions/ {
        set $sessions_upstream http://mic-sessions:8000;
        rewrite ^/api/sessions/(.*)$ /$1 break;
        proxy_pass $sessions_upstream;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        # Event streams stay open for hours; heartbeats keep them alive well within this window.
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }

    location /api/stt/ {
        proxy_pass http://127.0.0.1:59100;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 1900s;
        proxy_read_timeout 1900s;
        proxy_buffering off;
    }

    # Content-hashed Vite output: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The shell is revalidated on every load so a new release is picked up at once.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
